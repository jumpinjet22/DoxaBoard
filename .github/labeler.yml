# PR labels by changed files (actions/labeler v5 format).
connector:
  - changed-files:
      - any-glob-to-any-file: ["connectors/**", "cmd/doxaboard-connector/**", "community-connectors.yaml"]
server:
  - changed-files:
      - any-glob-to-any-file: ["internal/server/**", "cmd/doxaboard-server/**"]
agent:
  - changed-files:
      - any-glob-to-any-file: ["internal/agent/**", "cmd/doxaboard-agent/**", "deploy/agent/**"]
core:
  - changed-files:
      - any-glob-to-any-file: ["core/**", "slides/**"]
deploy:
  - changed-files:
      - any-glob-to-any-file: ["deploy/**"]
ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".golangci.yml", "Makefile"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["go.mod", "go.sum"]
