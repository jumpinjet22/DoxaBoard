name: Dependency review

# Blocks PRs that add dependencies with known vulnerabilities or licenses
# incompatible with Apache-2.0. Runs on `pull_request` (not
# `pull_request_target`), so fork PRs get a read-only token and no secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Copyleft licenses we can't ship inside an Apache-2.0 project.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0
