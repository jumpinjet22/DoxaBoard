name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: build (arm64, armv7, amd64)
        run: make build
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: shell syntax
        run: |
          sh -n deploy/agent/install.sh
          sh -n deploy/server/relay/on-ready.sh
