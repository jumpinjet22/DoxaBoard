name: Fuzz

# Fuzzes the parsers that eat untrusted input (feeds from the internet and
# from sidecar connectors). Regular CI already runs the seed corpus as plain
# tests; this explores new inputs nightly. A failure uploads the crashing
# input; add it to testdata/fuzz/ with the fix.
on:
  schedule:
    - cron: "33 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./slides, target: FuzzParseValidate }
          - { pkg: ./connectors/rss, target: FuzzFeedToSlides }
          - { pkg: ./connectors/rss, target: FuzzHTMLToText }
          - { pkg: ./connectors/rss, target: FuzzTruncate }
          - { pkg: ./connectors/rss, target: FuzzParseDate }
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: fuzz
        run: go test "${{ matrix.pkg }}" -run='^$' -fuzz="^${{ matrix.target }}\$" -fuzztime=3m
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crasher-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/"
