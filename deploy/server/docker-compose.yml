# DoxaBoard server stack.
#
#   OBS --SRT--> relay (mediamtx) --+--> multicast to every screen on the LAN
#                                   +--> SRT/RTSP/HLS for screens that pull
#                                   +--> Vimeo / YouTube / Facebook (Go Live)
#
#   rclone (cloud drives) --> ./photos --> doxaboard-server --> screens (cached)
#
# Usage:
#   cp .env.example .env   # then edit it
#   mkdir -p data secrets photos rclone run
#   sudo chown 65532:65532 data secrets photos rclone run
#   docker compose up -d
#
# Cloud drives are connected from the console (Content > Cloud folders).
#
# Both services use host networking. The relay needs it for multicast and
# SRT (UDP); the server needs it to reach the relay's control API, which
# only listens on 127.0.0.1. The console is on http://<server>:8080.

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      DOXABOARD_ADMIN_TOKEN: ${DOXABOARD_ADMIN_TOKEN:?set in .env}
      DOXABOARD_ENROLLMENT_TOKEN: ${DOXABOARD_ENROLLMENT_TOKEN:?set in .env}
      DOXABOARD_DB: /data/doxaboard.db
      DOXABOARD_PHOTO_DIR: /photos
      # Encrypts connector API keys. Kept apart from ./data so a database
      # backup alone doesn't include the key. Back it up separately.
      DOXABOARD_SECRET_KEY_FILE: /secrets/secret.key
      DOXABOARD_TIMEZONE: ${DOXABOARD_TIMEZONE:-}
      DOXABOARD_LIVE_TOKEN: ${DOXABOARD_LIVE_TOKEN:-}
      DOXABOARD_RELAY_API: http://127.0.0.1:9997
      # Optional branding: put theme.json (and its fonts and logo) in ./theme.
      # See docs/theming.md.
      DOXABOARD_THEME_DIR: /theme
      DOXABOARD_RCLONE_SOCKET: /run/rclone/rclone.sock
    volumes:
      - ./run:/run/rclone
      - ./data:/data
      - ./secrets:/secrets
      - ./photos:/photos:ro
      - ./theme:/theme:ro

  relay:
    # The -ffmpeg variant includes ffmpeg for the multicast fanout.
    # Pinned by tag AND digest: the tag is for humans, the digest is what
    # actually gets pulled. Dependabot updates both.
    image: bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2
    restart: unless-stopped
    network_mode: host
    environment:
      MULTICAST_ADDR: ${MULTICAST_ADDR:-239.10.10.1:5000}
      MULTICAST_TTL: ${MULTICAST_TTL:-2}
      MULTICAST_IFACE_ADDR: ${MULTICAST_IFACE_ADDR:-}
    volumes:
      - ./relay/mediamtx.yml:/mediamtx.yml:ro
      - ./relay/on-ready.sh:/on-ready.sh:ro

  rclone:
    # Connects cloud drives (OneDrive, Google Drive, Dropbox) and mirrors
    # the folders you pick into ./photos, one album each. Set it up in the
    # console: Content > Cloud folders. See docs/cloud-drives.md.
    #
    # It runs as a daemon the server drives over a unix socket in ./run;
    # nothing listens on the network. Host networking is for the sign-in:
    # while you connect a drive, rclone listens on 127.0.0.1:53682 and the
    # server hands it the result.
    image: rclone/rclone:1.76@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: unless-stopped
    network_mode: host
    # Same user as the server, so the server can open the socket.
    user: "65532:65532"
    command:
      - rcd
      - --rc-addr=unix:///run/rclone/rclone.sock
      - --rc-no-auth
      - --log-file=/run/rclone/rclone.log
      - --log-file-max-size=5M
      - --log-file-max-backups=1
    volumes:
      - ./rclone:/config/rclone
      - ./photos:/photos
      - ./run:/run/rclone
