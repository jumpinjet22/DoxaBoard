# mediamtx relay for DoxaBoard. OBS publishes once; everyone else reads.
# Written for mediamtx 1.21. Check the release notes before bumping.
#
# OBS publish (Settings > Stream > Custom):
#   SRT:  srt://<server-ip>:8890?streamid=publish:live&pkt_size=1316
#   RTMP: rtmp://<server-ip>/live   (stream key empty)
#
# Screens read:
#   multicast: udp://239.10.10.1:5000          (fanout, see on-ready.sh)
#   SRT:       srt://<server-ip>:8890?streamid=read:live
#   RTSP:      rtsp://<server-ip>:8554/live
#   HLS:       http://<server-ip>:8888/live/index.m3u8

logLevel: info

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: true
rtmpAddress: :1935

srt: true
srtAddress: :8890

hls: true
hlsAddress: :8888
# Low-latency HLS for smart TVs and the Android app (2-3 s behind live).
hlsVariant: lowLatency
hlsSegmentCount: 7

webrtc: false

# Control API: DoxaBoard uses it to start and stop the public broadcast
# (forwarding to Vimeo, YouTube, Facebook...). Bound to localhost only:
# it can reconfigure the relay, so it must never be reachable from the LAN.
api: true
apiAddress: 127.0.0.1:9997

paths:
  live:
    # Don't let another client kick OBS off and publish in its place.
    # (Anyone on the network can still publish while OBS is offline:
    # see the publish-credentials item in ROADMAP.md.)
    overridePublisher: false
    # When OBS starts publishing, start the multicast fanout to screens.
    # Public outputs (Vimeo, YouTube...) are forwarded by mediamtx itself,
    # switched on and off by DoxaBoard's Go Live / End.
    runOnAvailable: /on-ready.sh
    runOnAvailableRestart: true
